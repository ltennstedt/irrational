[versions]
cyclonedx = "3.3.0"
detekt = "1.23.8"
dokka = "2.2.0"
expressly = "6.0.0"
groovy = "5.0.7"
hibernate-validator = "9.0.1.Final"
jakarta-validation = "3.1.1"
junit = "6.1.2"
kotest = "6.2.3"
kotlin = "2.2.21"
licensee = "1.14.1"
spock = "2.4-groovy-5.0"
spotbugs = "6.5.9"
spotless = "8.6.0"
validate-poms = "9.5.0"
version-catalog-update = "1.1.0"

[plugins]
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
kotest = { id = "io.kotest", version.ref = "kotest" }
kotlin = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
version-catalog-update = { id = "nl.littlerobots.version-catalog-update", version.ref = "version-catalog-update" }

[libraries]
cyclonedx-plugin = { module = "org.cyclonedx.bom:org.cyclonedx.bom.gradle.plugin", version.ref = "cyclonedx" }
expressly = { module = "org.glassfish.expressly:expressly", version.ref = "expressly" }
groovy = { module = "org.apache.groovy:groovy", version.ref = "groovy" }
hibernate-validator = { module = "org.hibernate.validator:hibernate-validator", version.ref = "hibernate-validator" }
jakarta-validation = { module = "jakarta.validation:jakarta.validation-api", version.ref = "jakarta-validation" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
kotest-bom = { module = "io.kotest:kotest-bom", version.ref = "kotest" }
licensee-plugin = { module = "app.cash.licensee:app.cash.licensee.gradle.plugin", version.ref = "licensee" }
spock = { module = "org.spockframework:spock-core", version.ref = "spock" }
spotbugs-plugin = { module = "com.github.spotbugs:com.github.spotbugs.gradle.plugin", version.ref = "spotbugs" }
spotless-plugin = { module = "com.diffplug.spotless:com.diffplug.spotless.gradle.plugin", version.ref = "spotless" }
validate-poms-plugin = { module = "io.freefair.maven-central.validate-poms:io.freefair.maven-central.validate-poms.gradle.plugin", version.ref = "validate-poms" }
